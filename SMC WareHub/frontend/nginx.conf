server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # GHI ĐÈ (không nối thêm) để người ngoài không tự đặt được IP giả nhằm lẩn tránh khoá đăng nhập của backend.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Header bảo mật của API do backend tự thêm (tránh trùng lặp), nên không include snippet ở đây.
  }

  # SPA fallback - moi route khong khop file tinh se tra ve index.html
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
