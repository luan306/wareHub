# Header bảo mật cho trang web (nginx). Được include trong MỌI khối location có add_header riêng, vì nginx không kế thừa
# add_header từ cấp cao hơn khi location tự khai báo add_header.
#
# CSP: chỉ chạy tài nguyên của chính máy chủ này. Font đã đóng gói sẵn nên không cần Google Fonts; 'unsafe-inline' chỉ dành cho
# style (React dùng style="..." và trang in tạo thẻ <style> khổ giấy lúc chạy), KHÔNG cho script — nên XSS không chèn được mã chạy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
