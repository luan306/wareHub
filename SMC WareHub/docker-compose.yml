services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme_db_password}
      MYSQL_DATABASE: WareHub
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-dotnet
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=WareHub;User=root;Password=${DB_PASSWORD:-changeme_db_password}
      Jwt__Secret: ${JWT_SECRET:-change_this_production_secret_to_at_least_32_characters}
      DefaultAdmin__User: ${DEFAULT_ADMIN_USER:-admin}
      DefaultAdmin__Password: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      DefaultAdmin__FullName: ${DEFAULT_ADMIN_FULLNAME:-Quan tri vien}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
