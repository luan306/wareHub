upstream warehub_app {
  include /etc/nginx/state/upstream.conf;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=warehub_login:10m rate=20r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  location / {
    proxy_pass http://warehub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  location = /api/auth/login {
    limit_req zone=warehub_login burst=10 nodelay;
    proxy_pass http://warehub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  location = /api/employees/cost-centers/import {
    client_max_body_size 8m;
    proxy_pass http://warehub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
  }

  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
