# Cổng vào của hệ thống (nằm ở cấp http của nginx). Bộ nhận lưu lượng nằm trong state/upstream.conf, ví dụ:
#     server web-blue:80;
# do ./bluegreen.sh ghi; nginx chỉ đọc file này khi khởi động hoặc `nginx -s reload`.
upstream warehub_app {
  include /etc/nginx/state/upstream.conf;
  keepalive 32;
}

# Giới hạn tốc độ đăng nhập theo IP (lớp bảo vệ thứ hai, ngoài việc backend tự khoá khi sai nhiều lần).
limit_req_zone $binary_remote_addr zone=warehub_login:10m rate=20r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  # Dùng chung cho mọi yêu cầu chuyển tiếp. X-Forwarded-For GHI ĐÈ bằng IP thật của người kết nối tới gateway: người ngoài không
  # thể tự đặt IP giả để lẩn tránh khoá đăng nhập. (Nếu đặt thêm 1 proxy/tường lửa phía trước gateway thì phải chỉnh lại chỗ này.)
  location / {
    proxy_pass http://warehub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
    # Chỉ thử lại các yêu cầu đọc (GET) khi bộ đích lỗi kết nối; yêu cầu ghi (POST/PUT/DELETE) không bao giờ bị gửi lặp.
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  location = /api/auth/login {
    limit_req zone=warehub_login burst=10 nodelay;
    proxy_pass http://warehub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }

  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
