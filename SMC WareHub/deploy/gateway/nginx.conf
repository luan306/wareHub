# Cổng vào của hệ thống (nằm ở cấp http của nginx). Bộ nhận lưu lượng nằm trong state/upstream.conf, ví dụ:
#     server web-blue:80;
# do ./bluegreen.sh ghi; nginx chỉ đọc file này khi khởi động hoặc `nginx -s reload`.
upstream warehub_app {
  include /etc/nginx/state/upstream.conf;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 5m;

  location / {
    proxy_pass http://warehub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 300s;
    # Chỉ thử lại các yêu cầu đọc (GET) khi bộ đích lỗi kết nối; yêu cầu ghi (POST/PUT/DELETE) không bao giờ bị gửi lặp.
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
